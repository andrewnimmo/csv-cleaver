name: Release

# Push a tag to cut a release:
#     git tag v2.0.0 && git push origin v2.0.0
#
# jpackage builds for the architecture of the JDK that runs it — there is no
# cross-compilation flag. The Intel macOS installer is therefore built on the
# Apple Silicon runner by running an x64 JDK under Rosetta 2: an emulated
# native build, not a cross-compile. Everything downstream follows the JDK's
# own reported arch — jpackage's launcher and runtime, and tools.deps'
# JavaFX native classifiers (chosen from os.arch of the resolving JVM) — and
# the arch of the result is read back from the built binary with lipo rather
# than assumed. Intel runners themselves need a paid GitHub plan.
#
# Nothing here is signed. The steps marked "signing" activate the moment the
# corresponding secrets exist, so turning it on later means adding secrets
# rather than editing this file.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            slug: macos-arm64
            java-arch: aarch64
            mac-arch: apple-silicon
            script: ./package/build-mac.sh
            artifacts: dist/*.dmg
          - os: macos-latest
            label: macOS (Intel)
            slug: macos-x64
            java-arch: x64
            mac-arch: intel
            script: ./package/build-mac.sh
            artifacts: dist/*.dmg
          - os: windows-latest
            label: Windows (x64)
            slug: windows-x64
            script: package\build-windows.bat
            artifacts: dist/*.msi
          - os: ubuntu-latest
            label: Linux (x64)
            slug: linux-x64
            script: ./package/build-linux.sh
            artifacts: |
              dist/*.deb
              dist/*.AppImage

    steps:
      - uses: actions/checkout@v4

      # ── Signing, part 1: the certificate ────────────────────────────────
      # Inert until the secrets exist. MACOS_CERTIFICATE is a base64 .p12 of a
      # Developer ID Application certificate; the identity goes into a
      # throwaway keychain that dies with the runner. docs/SIGNING.md walks
      # through creating all of it.
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.HAVE_CERT != ''
        env:
          HAVE_CERT: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PW=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN"             -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:             -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN"                      | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Will sign as: $IDENTITY"

      # Rosetta 2 ships on GitHub's Apple Silicon images, but "ships" is an
      # assumption about someone else's image; installing is idempotent and
      # the x64 JDK below fails loudly either way.
      - name: Ensure Rosetta 2 (Intel-on-ARM build)
        if: runner.os == 'macOS' && matrix.java-arch == 'x64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      # java-arch is what makes the Intel build Intel: an x64 JDK under
      # Rosetta reports os.arch=x86_64, and everything keys off that. Empty
      # (the non-mac jobs) means the runner's own architecture.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: ${{ matrix.java-arch }}

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          bb: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot libfuse2

      # Two build steps because one is not possible: the previous single step
      # forced bash everywhere, and bash read the Windows script's backslash
      # as an escape — `package\build-windows.bat` became
      # `packagebuild-windows.bat`, exit 127. A .bat needs cmd.
      - name: Build installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x package/*.sh || true
          ${{ matrix.script }}

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ${{ matrix.script }}

      # Both macOS jobs emit "CSV Cleaver-<version>.dmg". Left alone, the
      # released files would collide when the artifacts are merged and one
      # architecture would silently overwrite the other — an Intel user
      # downloading an Apple Silicon binary. The architecture goes into the
      # name here, and it is read from the built launcher itself with lipo,
      # not from uname — both jobs now run on the same ARM runner, so uname
      # would call the Intel build apple-silicon. The matrix says what each
      # job promises; lipo says what it produced; a mismatch fails rather
      # than releases.
      - name: Name and verify the architecture (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN=$(find target/app-image -type f -path '*/Contents/MacOS/*' | head -1)
          arch=$(lipo -archs "$BIN" | sed 's/x86_64/intel/; s/arm64/apple-silicon/')
          if [ "$arch" != "${{ matrix.mac-arch }}" ]; then
            echo "!!! This job promises ${{ matrix.mac-arch }} but built $arch" >&2
            exit 1
          fi
          for f in dist/*.dmg; do
            mv "$f" "${f%.dmg}-${arch}.dmg"
          done

      # ── Signing, part 2: notarisation ───────────────────────────────────
      # The build above already signed everything if an identity was imported;
      # jpackage applies the hardened runtime and the entitlements in
      # package/macos/entitlements.plist. Here Apple scans the disk image and
      # the ticket is stapled inside it, so Gatekeeper accepts it offline.
      - name: Notarise and staple (macOS)
        if: runner.os == 'macOS' && env.HAVE_ASC != ''
        env:
          HAVE_ASC: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "$ASC_KEY_P8" > asc-key.p8
          for f in dist/*.dmg; do
            xcrun notarytool submit "$f"               --key asc-key.p8 --key-id "$ASC_KEY_ID"               --issuer "$ASC_ISSUER_ID" --wait
            xcrun stapler staple "$f"
          done
          rm asc-key.p8

      # The claim "notarised" is OBSERVED per release or the release does not
      # happen: Gatekeeper itself is asked, and refusal fails the build.
      - name: Gatekeeper would accept this (macOS)
        if: runner.os == 'macOS' && env.HAVE_ASC != ''
        env:
          HAVE_ASC: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for f in dist/*.dmg; do
            spctl --assess --type open --context context:primary-signature -v "$f"
          done

      # ── Windows Authenticode, inert placeholder ─────────────────────────
      # Since 2023 certificates live in hardware or a cloud signer. When an
      # Azure Trusted Signing account exists, sign dist/*.msi here with
      # azure/trusted-signing-action and the AZURE_* secrets; SmartScreen
      # warnings then fade with reputation. docs/SIGNING.md has the details.

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.slug }}-installers
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # Free integrity for every platform, signed or not: a user can verify
      # their download against the published digest.
      - name: Checksums
        run: |
          cd installers
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          generate_release_notes: true
          body: |
            ## Installing

            Unless this release says otherwise below, the installers are
            **not code signed**, and each system will warn about them the
            first time. `SHA256SUMS` lists every file's digest for manual
            verification either way.

            **macOS** — the first attempt will say the application cannot be
            opened. Right-click it in Applications and choose Open, then confirm.
            You only have to do this once. Download the Apple Silicon build for
            an M-series Mac, the Intel build for anything older.

            **Windows** — SmartScreen shows "Windows protected your PC". Choose
            More info, then Run anyway.

            **Linux** — install the `.deb` with
            `sudo dpkg -i csv-cleaver_*.deb`, or make the AppImage executable
            with `chmod +x` and run it directly.

            Every installer contains its own Java runtime. Nothing else is needed.

            ## Provenance

            This codebase was written predominantly by Claude (Anthropic,
            model `claude-fable-5`, via Claude Code) under the direction of
            **Andrew David Nimmo** as Technical Project Manager, who set the
            requirements, made the decisions, and acceptance-tested every
            build. [PROVENANCE.md](https://github.com/andrewnimmo/csv-cleaver/blob/main/docs/PROVENANCE.md)
            states precisely what that means;
            [VERIFICATION.md](https://github.com/andrewnimmo/csv-cleaver/blob/main/docs/VERIFICATION.md)
            records what is verified and how.

            Made with 🤖 in Barcelona.
