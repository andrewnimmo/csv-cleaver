name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Check formatting
        run: bb format:check

      - name: Lint
        run: bb lint

      # No default-locale text operations outside csv-cleaver.text and
      # csv-cleaver.i18n. See dev/locale_lint.clj and decision 19.
      - name: Locale lint
        run: bb locale-lint

      # JavaFX needs a display. Linux runners have none, so the smoke tests that
      # build real widgets run under a virtual one; macOS and Windows runners
      # have a desktop session already.
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a clojure -M:test

      - name: Test
        if: runner.os != 'Linux'
        run: clojure -M:test

      # The whole suite again with the JVM defaulted to Turkish — the locale
      # whose dotted and dotless i makes an unpinned case fold fail loudly.
      # One platform is enough: the JDK's locale data is the same on all three,
      # so this run varies the locale, not the operating system.
      - name: Test under tr_TR (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a bb test-tr

  # The vulnerability audit lives in audit.yml, on the self-hosted runner,
  # and deliberately has no pull_request trigger — see the note there.

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Coverage
        run: xvfb-run -a clojure -M:coverage

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage
          retention-days: 14

  screens:
    name: Screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      # Renders every screen in both themes, so a change to the interface can be
      # reviewed by looking at it rather than by reading the diff.
      - name: Render every screen
        run: xvfb-run -a clojure -M:shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screens
          path: target/shots
          retention-days: 14
