name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Check formatting
        run: bb format:check

      - name: Lint
        run: bb lint

      # No default-locale text operations outside csv-cleaver.text and
      # csv-cleaver.i18n. See dev/locale_lint.clj and decision 19.
      - name: Locale lint
        run: bb locale-lint

      # JavaFX needs a display. Linux runners have none, so the smoke tests that
      # build real widgets run under a virtual one; macOS and Windows runners
      # have a desktop session already.
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a clojure -M:test

      - name: Test
        if: runner.os != 'Linux'
        run: clojure -M:test

      # The whole suite again with the JVM defaulted to Turkish — the locale
      # whose dotted and dotless i makes an unpinned case fold fail loudly.
      # One platform is enough: the JDK's locale data is the same on all three,
      # so this run varies the locale, not the operating system.
      - name: Test under tr_TR (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a bb test-tr

  security:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      # Known vulnerabilities in anything that ships. nvd-clojure requires an
      # NVD API key: add NVD_API_KEY as a repository secret, or this step fails
      # rather than passing quietly. Get one free from
      # https://nvd.nist.gov/developers/request-an-api-key
      # dependency-check's first run builds a local NVD mirror, which dies
      # readily on runner networks — and the default cache saves only on job
      # success, so a failed build could never seed its own cache: a permanent
      # red loop. The database is therefore cached with an explicit always-save,
      # and the audit retried once; a resumed build completes what the first
      # attempt fetched.
      - name: NVD cache key
        id: nvd-week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore NVD database
        uses: actions/cache/restore@v6
        with:
          # The real location, learned by finding the odc.mv.db on disk: the
          # database lives under the dependency-check-utils artifact,
          # version-scoped — which is also why upgrading the tool forces a
          # clean rebuild. The first version of this step cached a directory
          # that does not exist.
          path: ~/.m2/repository/org/owasp/dependency-check-utils/*/data
          key: nvd-db-${{ runner.os }}-${{ steps.nvd-week.outputs.week }}
          restore-keys: nvd-db-${{ runner.os }}-

      - name: Known vulnerabilities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bb audit || (echo "retrying once — NVD mirror build is flaky" && bb audit)

      - name: Save NVD database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-utils/*/data
          key: nvd-db-${{ runner.os }}-${{ steps.nvd-week.outputs.week }}

      # Being behind is not itself a vulnerability, but it is how you come to
      # be running one. Reported, not enforced.
      - name: Dependency drift
        continue-on-error: true
        run: bb outdated

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Coverage
        run: xvfb-run -a clojure -M:coverage

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage
          retention-days: 14

  screens:
    name: Screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      # Renders every screen in both themes, so a change to the interface can be
      # reviewed by looking at it rather than by reading the diff.
      - name: Render every screen
        run: xvfb-run -a clojure -M:shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screens
          path: target/shots
          retention-days: 14
