name: Pages

# The documentation site, https://andrewnimmo.github.io/csv-cleaver/ —
# built by `bb site` (dev/site.clj) from docs/*.md and site/, deployed on
# every push to main that touches either. Action versions checked against
# each repository's latest release on 2026-08-06.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'dev/site.clj'
      - 'bb.edn'
      - 'resources/branding.edn'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Babashka
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Build the site
        run: bb site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
